name: Owner login and security verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Dependencies
        run: bun install --frozen-lockfile
      - name: Automated tests
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Security changes lint (legacy formatting debt excluded)
        run: >
          bunx eslint
          src/lib/session.functions.ts src/lib/owner-auth.ts
          src/lib/ai.functions.ts src/lib/feeds.functions.ts src/lib/settings.ts
          src/lib/use-telegram-alerts.ts src/components/OwnerGate.tsx
          src/components/AppShell.tsx src/routes/__root.tsx src/routes/settings.tsx
          --rule "prettier/prettier: off"
          --rule "@typescript-eslint/no-explicit-any: warn"
          --rule "no-empty: warn"
          --rule "no-useless-escape: warn"
