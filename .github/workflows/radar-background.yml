name: Sanad background job discovery + daily digest

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are best-effort and can be delayed/skipped.
    # All cron expressions are UTC; Riyadh time is UTC+3 all year.
    # 08:07/08:27/08:47 then 09:07/09:27/09:47 Riyadh: morning + fallback.
    - cron: "7,27,47 5,6 * * *"
    # 20:07/20:27/20:47 then 21:07/21:27/21:47 Riyadh: evening + fallback.
    - cron: "7,27,47 17,18 * * *"
    # Other source scans approximately every two hours. 08/20h are covered above.
    - cron: "17 1,3,7,9,11,13,15,19,21,23 * * *"

permissions:
  contents: read

# For overlapping delayed runs, serialize rather than cancel: the database
# deduplicates individual opportunities and claims each morning/evening slot.
concurrency:
  group: sanad-background-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SANAD_DIGEST_URL: ${{ secrets.SANAD_DIGEST_URL }}
      SANAD_DIGEST_CRON_SECRET: ${{ secrets.SANAD_DIGEST_CRON_SECRET }}
    steps:
      - name: Verify scheduler configuration
        run: |
          if [ -z "$SANAD_DIGEST_URL" ] || [ -z "$SANAD_DIGEST_CRON_SECRET" ]; then
            echo "::error::The radar scheduler requires SANAD_DIGEST_URL and SANAD_DIGEST_CRON_SECRET."
            exit 1
          fi
          case "$SANAD_DIGEST_URL" in
            https://*/api/radar-cron) ;;
            *) echo "::error::SANAD_DIGEST_URL must be a HTTPS URL ending in /api/radar-cron"; exit 1 ;;
          esac
      - name: Discover and deliver due digest
        run: |
          response_file="$RUNNER_TEMP/sanad-radar-response.json"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 \
            --retry-all-errors --max-time 240 \
            -X POST -H "Authorization: Bearer $SANAD_DIGEST_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o "$response_file" "$SANAD_DIGEST_URL"

          # 200 OK by itself isn't evidence that any owner or source was checked.
          if ! jq -e '
            (.owner_count | type == "number") and (.owner_count > 0) and
            (.results | type == "array") and (.results | length > 0) and
            all(.results[]; .status == "scanned" or .status == "sent" or .status == "already-handled")
          ' "$response_file" > /dev/null; then
            echo "::error::Scan returned no owner, no results, or an invalid status."
            exit 1
          fi

          jq '{timestamp, owner_count, results}' "$response_file"
          echo "### Radar check" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "- " + .status + " | new seen: " + (.discovered | tostring) + " | sources OK: " + (.sources_ok | tostring) + " | failed: " + (.sources_failed | tostring)' "$response_file" >> "$GITHUB_STEP_SUMMARY"
