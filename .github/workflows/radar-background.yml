name: Sanad background job discovery + daily digest

on:
  workflow_dispatch:
  schedule:
    # UTC = Riyadh time - 3 hours (year-round).
    # Primary morning scan + immediate digest: 08:07 Riyadh.
    - cron: "7 5 * * *"
    # Fallback only if the morning report wasn't sent: 09:07 Riyadh.
    - cron: "7 6 * * *"
    # Primary evening scan + immediate digest: 20:07 Riyadh.
    - cron: "7 17 * * *"
    # Fallback only if the evening report wasn't sent: 21:07 Riyadh.
    - cron: "7 18 * * *"
    # GitHub's cron trigger is best-effort, not a minute-accurate SLA.
    # Server checks completed digest slots BEFORE collecting sources:
    # successful reports make the 09:07/21:07 calls cheap no-op checks.

permissions:
  contents: read

# Serialize delayed overlapping GitHub runs. The database prevents duplicate
# reports and already-sent slots skip expensive feed collection.
concurrency:
  group: sanad-background-radar
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SANAD_DIGEST_URL: ${{ secrets.SANAD_DIGEST_URL }}
      SANAD_DIGEST_CRON_SECRET: ${{ secrets.SANAD_DIGEST_CRON_SECRET }}
    steps:
      - name: Verify scheduler configuration
        run: |
          if [ -z "$SANAD_DIGEST_URL" ] || [ -z "$SANAD_DIGEST_CRON_SECRET" ]; then
            echo "::error::The radar scheduler requires SANAD_DIGEST_URL and SANAD_DIGEST_CRON_SECRET."
            exit 1
          fi
          case "$SANAD_DIGEST_URL" in
            https://*/api/radar-cron) ;;
            *) echo "::error::SANAD_DIGEST_URL must be a HTTPS URL ending in /api/radar-cron"; exit 1 ;;
          esac
      - name: Discover and deliver due digest
        run: |
          response_file="$RUNNER_TEMP/sanad-radar-response.json"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 \
            --retry-all-errors --max-time 240 \
            -X POST -H "Authorization: Bearer $SANAD_DIGEST_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o "$response_file" "$SANAD_DIGEST_URL"

          # 200 OK by itself isn't evidence that any owner or source was checked.
          if ! jq -e '
            (.owner_count | type == "number") and (.owner_count > 0) and
            (.results | type == "array") and (.results | length > 0) and
            all(.results[]; .status == "sent" or .status == "already-handled" or .status == "in-progress" or .status == "outside-window")
          ' "$response_file" > /dev/null; then
            echo "::error::Scheduled radar returned no owner, no results, or an invalid report status."
            exit 1
          fi

          jq '{timestamp, owner_count, results}' "$response_file"
          echo "### Sanad twice-daily radar" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "- " + .status + " | feeds skipped: " + (.skipped_collection | tostring) + " | discovered: " + (.discovered | tostring) + " | sources OK: " + (.sources_ok | tostring) + " | failed: " + (.sources_failed | tostring)' "$response_file" >> "$GITHUB_STEP_SUMMARY"
