name: Phase 1 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Changed modules lint (ignore existing formatter backlog)
        run: >
          bunx eslint
          src/lib/owner-auth.ts src/components/OwnerGate.tsx
          src/lib/feeds.ts src/lib/opportunities.ts src/lib/feeds.functions.ts
          src/lib/ai.functions.ts src/lib/use-telegram-alerts.ts src/lib/settings.ts
          src/routes/settings.tsx src/routes/index.tsx src/routes/__root.tsx
          src/components/AppShell.tsx src/components/OpportunityCard.tsx
          --rule "prettier/prettier: off"
          --rule "@typescript-eslint/no-explicit-any: warn"
          --rule "no-empty: warn"
          --rule "no-useless-escape: warn"
      - name: Existing full-repository lint backlog (non-blocking)
        continue-on-error: true
        run: bun run lint
