name: Phase 1 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run lint
      - run: bun run build
