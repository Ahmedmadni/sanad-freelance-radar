name: Data quality verification
on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/data-quality.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Changed-code lint without legacy formatting backlog
        run: >
          bunx eslint
          src/lib/feeds.ts src/lib/opportunities.ts src/lib/saudi-job-sites.ts
          src/lib/use-telegram-alerts.ts src/components/OpportunityCard.tsx
          src/routes/index.tsx src/routes/settings.tsx src/test/feeds.test.ts
          --rule "prettier/prettier: off"
          --rule "@typescript-eslint/no-explicit-any: warn"
          --rule "no-empty: warn"
