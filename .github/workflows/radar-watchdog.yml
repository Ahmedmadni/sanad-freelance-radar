name: Sanad independent GitHub digest watchdog

on:
  workflow_dispatch:
  # An initial run on merge validates the live endpoint and existing secrets;
  # subsequent checks use the separate cron schedule below.
  push:
    branches: [main]
    paths:
      - "src/lib/digest.*"
      - "src/lib/feeds.functions.ts"
      - "src/lib/source-health.ts"
      - ".github/workflows/radar-watchdog.yml"
  schedule:
    # Staggered behind the primary workflow, both use UTC. Riyadh = UTC+3.
    # Morning: 08:14, 08:44, 09:14, 10:14
    - cron: "14 5,6,7 * * *"
    - cron: "44 5 * * *"
    # Evening: 20:14, 20:44, 21:14, 22:14
    - cron: "14 17,18,19 * * *"
    - cron: "44 17 * * *"
    # Early-morning recovery of any prior-day missed evening digest.
    - cron: "31 2 * * *"

permissions:
  contents: read

# Share the same lock with the main workflow to avoid racing requests. The
# database also uses an atomic slot claim if a managed scheduler is enabled.
concurrency:
  group: sanad-background-radar
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SANAD_DIGEST_URL: ${{ secrets.SANAD_DIGEST_URL }}
      SANAD_DIGEST_CRON_SECRET: ${{ secrets.SANAD_DIGEST_CRON_SECRET }}
    steps:
      - name: Check server-only settings
        shell: bash
        run: |
          test -n "$SANAD_DIGEST_URL" || { echo "::error::Missing SANAD_DIGEST_URL"; exit 1; }
          test -n "$SANAD_DIGEST_CRON_SECRET" || { echo "::error::Missing SANAD_DIGEST_CRON_SECRET"; exit 1; }
          case "$SANAD_DIGEST_URL" in
            https://*/api/radar-cron) ;;
            *) echo "::error::Unexpected radar endpoint"; exit 1 ;;
          esac
      - name: Verify due digests and recover missed reports
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/sanad-watchdog.json"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 \
            --retry-all-errors --max-time 240 \
            -X POST -H "Authorization: Bearer $SANAD_DIGEST_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o "$response_file" "$SANAD_DIGEST_URL"

          if ! jq -e '
            (.owner_count | type == "number") and (.owner_count > 0) and
            (.results | type == "array") and (.results | length > 0) and
            all(.results[]; .status == "sent" or .status == "already-handled" or .status == "in-progress")
          ' "$response_file" >/dev/null; then
            echo "::error::Radar did not confirm a valid report status."
            exit 1
          fi
          echo "### Sanad watchdog report (UTC)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] |
            "- status: " + .status
            + " | slot: " + (.slot // "all due slots checked")
            + " | discovered: " + ((.discovered // 0) | tostring)
            + " | unavailable sources: " + ((.sources_failed // 0) | tostring)
          ' "$response_file" >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'any(.results[]; .status == "in-progress")' "$response_file" >/dev/null; then
            echo "::warning::A digest is still sending; it should be verified on the next watchdog run."
          fi
